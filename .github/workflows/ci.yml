name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: py2ports validate --metadata-only
      - run: python -m pytest
      - run: echo 'Private games remain metadata-only; public shipped games are exercised in the ARM64 job.'
  arm64-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/runtimes
          key: public-runtime-arm64-${{ hashFiles('runtime/*') }}
      - run: python tests/runtime_smoke.py
      - name: Initialize only the shipped public games
        run: git submodule update --init -- games/py2ports_snake games/py2ports_breakout
      - run: python tests/public_games_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-playable-games
          path: |
            dist/py2ports_snake.zip
            dist/py2ports_breakout.zip
            dist/public-games-SHA256SUMS
          if-no-files-found: error
